# Local only: not reachable from other machines, no usage statistics sent.
[server]
address = "localhost"
# Watching source files for auto-reload held back the table by about 5 s per page
# load. Without it, restart the dashboard after editing its code.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Streamlit 1.67 changed the default dark theme to a brown-grey; pin the earlier navy
# one so every machine looks the same whatever version it has.
[theme]
base = "dark"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#262730"
textColor = "#fafafa"
