[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-betting-research"
version = "0.1.0"
description = "Research and implementation of sports betting value strategies"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "playwright>=1.50",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
dashboard = [
    "streamlit>=1.66",
]
historical = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
# Scripts import each other by bare name (they add src/ and scripts/ to sys.path).
extraPaths = ["src", "scripts"]
